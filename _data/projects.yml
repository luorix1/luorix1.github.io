# Portfolio projects shown on /projects/ and summarized at the top of each project page.
#
# featured: true  -> full project description (IMRD or IDEC) with its own page
# format          -> "IMRD" (Introduction, Methods, Results, Discussion) for research
#                    "IDEC" (Introduction, Design, Evaluation, Conclusion) for design projects
# url             -> project page; the page looks itself up here by URL
# objective       -> one sentence: what the project set out to do
# impact          -> one sentence: social value (who benefits and why)
# role            -> one or two sentences: my specific contribution
# result          -> headline outcome shown on the card
# skills          -> names from _data/skills.yml (used by the skill filter)

- id: kinematics
  featured: true
  format: IMRD
  title: "Device-Agnostic Joint Moment Estimation for Exoskeletons"
  kind: "Research · First author"
  year: 2026
  url: /publications/kinematics-joint-moments/
  thumbnail: /images/publications/kinematics-joint-moments/thumb.webp
  thumbnail_hover: /images/publications/kinematics-joint-moments/thumb-hover.webp
  objective: "Train one biological joint-moment estimator on open-source data and run it on any wearable that can measure joint kinematics."
  impact: "Exoskeleton controllers today need new data for every device; reusing public data lowers the cost of bringing assistance to more people."
  role: "First author. I designed the kinematics-based framework, aggregated the open-source training data, trained the estimators, and evaluated them on three wearable platforms."
  result: "R² up to 0.85 with no device-specific fine-tuning"
  skills: ["Machine learning", "Biomechanics & simulation", "Wearable robotics & control", "Embedded systems & sensing"]

- id: parkinsons
  featured: true
  format: IMRD
  title: "Personalized Hip Exoskeleton Assistance for Parkinson’s Disease"
  kind: "Clinical research · Co-author"
  year: 2026
  url: /publications/personalized-hip-assistance/
  thumbnail: /images/publications/personalized-hip-assistance/thumb.webp
  thumbnail_hover: /images/publications/personalized-hip-assistance/thumb-hover.webp
  objective: "Tune a hip exoskeleton to each person with Parkinson’s disease so that it lengthens their stride toward healthy values."
  impact: "Short, shuffling steps and freezing of gait cause falls and loss of independence for millions of people with Parkinson’s disease."
  role: "I built the IMU-based stride-length pipeline that scored every candidate controller during optimization and supported gait analysis during evaluation."
  result: "+23% stride length across 10 participants"
  skills: ["Wearable robotics & control", "Experimental design & analysis", "Embedded systems & sensing"]

- id: aerial-righting
  featured: true
  format: IDEC
  title: "Spine–Tail Coordination for Aerial Righting in a Multi-Link Robot"
  kind: "Course design project · 24-775"
  year: 2025
  url: /projects/aerial-righting/
  thumbnail: /images/projects/aerial-righting/thumb.webp
  objective: "Determine whether an active tail improves mid-air righting of a cat-inspired robot beyond what its two-degree-of-freedom spine achieves alone."
  impact: "Robots that reorient while falling land on their feet, protecting hardware in search-and-rescue, legged locomotion, and exploration."
  role: "Team member. I contributed to the MuJoCo simulation, the learning-based controller, and the drop-test evaluation."
  result: "Spine alone rights the robot; tail added no significant gain"
  skills: ["Biomechanics & simulation", "Machine learning", "Embedded systems & sensing"]

