- id: boostershot
  featured: true
  format: IMRD
  title: "Booster-SHOT: Attention for Multiview Pedestrian Detection"
  kind: "Research · First author · WACV 2024"
  year: 2024
  url: /publications/boostershot/
  thumbnail: /images/publications/boostershot/thumb.webp
  thumbnail_hover: /images/publications/boostershot/thumb-hover.webp
  objective: "Improve how a calibrated multi-camera system fuses its views to locate every pedestrian on a bird’s-eye-view map."
  impact: "Reliable crowd localization supports safety monitoring in stations, stadiums, and other crowded public spaces where people occlude each other."
  role: "First author. I proposed the Homography Attention Module, built Booster-SHOT, and ran the experiments; the module is patented in Korea and the US."
  result: "State-of-the-art 92.9% / 94.2% MODA"
  skills: ["Machine learning"]

- id: privacy
  featured: true
  format: IMRD
  title: "Privacy-Safe Image Encoding via Frequency Filtering"
  kind: "Research · Co-author · IJCAI-ECAI workshop"
  year: 2022
  url: /publications/privacy-frequency-filtering/
  thumbnail: /images/publications/privacy-frequency-filtering/thumb.webp
  thumbnail_hover: /images/publications/privacy-frequency-filtering/thumb-hover.webp
  objective: "Design a client-side image encoder that keeps images useful for a recognition task while preventing attackers from reconstructing them."
  impact: "Cloud vision services receive images that can reveal identity and sensitive attributes; users need protection before data leaves their device."
  role: "Co-author (4th of 7). I organized the user study that tested whether people could recognize gender from attacker reconstructions, and ran part of the ablation experiments."
  result: "Attacker reconstructions reduced to chance-level gender recognition"
  skills: ["Machine learning"]

