- title: "Personalized Hip Assistance to Improve Gait Performance in Individuals with Parkinson’s Disease"
  authors: "S. Kim, S. Noh, S. J. Yun, J. Hwang, Y. Kwon, B. Lim, Y. Lee, H. G. Seo, K. Kim, and J. Kim"
  venue: "Journal of NeuroEngineering and Rehabilitation"
  year: 2026
  type: journal
  status: "Manuscript submitted"
  project_url: "/publications/personalized-hip-assistance/"
  paper_url: "/files/personalized-hip-assistance-pd.pdf"
  doi: "https://doi.org/10.21203/rs.3.rs-10612204/v1"
  featured: true
  abstract: |
    Personalized bilateral hip assistance on the WIM wearable robot was tuned with **human-in-the-loop CMA-ES** to raise stride length toward healthy norms in individuals with Parkinson’s disease. Optimized assistance increased stride length by **23%**, improved cadence, hip ROM, and foot–floor angle, reduced freezing in one participant, and largely preserved benefits under **dual-task** walking.

