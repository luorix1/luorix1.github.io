- title: "Booster-SHOT: Boosting Stacked Homography Transformations for Multiview Pedestrian Detection with Attention"
  authors: "J. Hwang, P. Benz, and P. Kim"
  venue: "IEEE/CVF Winter Conference on Applications of Computer Vision (WACV)"
  year: 2024
  type: conference
  project_url: "/publications/boostershot/"
  paper_url: "https://openaccess.thecvf.com/content/WACV2024/papers/Hwang_Booster-SHOT_Boosting_Stacked_Homography_Transformations_for_Multiview_Pedestrian_Detection_With_WACV_2024_paper.pdf"
  doi: "https://doi.org/10.1109/WACV57701.2024.00043"
  slides_url: "/files/Booster-SHOT_ Boosting Stacked Homography Transformations for Multiview Pedestrian Detection with Attention.pptx"
  featured: true
  abstract: |
    Improving multi-view aggregation is integral for multiview pedestrian detection, which aims to obtain a bird’s-eye-view pedestrian occupancy map from images captured through a set of calibrated cameras. Inspired by the success of attention modules for deep neural networks, we first propose a Homography Attention Module (HAM) which is shown to boost the performance of existing end-to-end multiview detection approaches by utilizing a novel channel gate and spatial gate. Additionally, we propose Booster-SHOT, an end-to-end convolutional approach to multiview pedestrian detection incorporating our proposed HAM as well as elements from previous approaches such as view-coherent augmentation or stacked homography transformations. Booster-SHOT achieves 92.9% and 94.2% for MODA on Wildtrack and MultiviewX respectively, outperforming the state-of-the-art by 1.4% on Wildtrack and 0.5% on MultiviewX, achieving state-of-the-art performance overall for standard evaluation metrics used in multi-view pedestrian detection.

- title: "Privacy Safe Representation Learning via Frequency Filtering Encoder"
  authors: "J. Jeong, M. Cho, P. Benz, J. Hwang, J. Kim, S. Lee, and T. H. Kim"
  venue: "IJCAI-ECAI Workshop on Artificial Intelligence Safety (AISafety)"
  year: 2022
  type: workshop
  project_url: "/publications/privacy-frequency-filtering/"
  paper_url: "https://arxiv.org/pdf/2208.02482"
  featured: true
  abstract: |
    Deep learning models are increasingly deployed in real-world applications. These models are often deployed on the server-side and receive user data in an information-rich representation to solve a specific task, such as image classification. Since images can contain sensitive information, which users might not be willing to share, privacy protection becomes increasingly important. Adversarial Representation Learning (ARL) is a common approach to train an encoder that runs on the client-side and obfuscates an image. It is assumed, that the obfuscated image can safely be transmitted and used for the task on the server without privacy concerns. However, in this work, we find that training a reconstruction attacker can successfully recover the original image of existing ARL methods. To this end, we introduce a novel ARL method enhanced through low-pass filtering, limiting the available information amount to be encoded in the frequency domain. Our experimental results reveal that our approach withstands reconstruction attacks while outperforming previous state-of-the-art methods regarding the privacy-utility trade-off. We further conduct a user study to qualitatively assess our defense of the reconstruction attack.
