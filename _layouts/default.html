<!DOCTYPE html>
<html lang="{{ site.locale | default: 'en-US' | slice: 0, 2 }}">
<head>
  {% include site-head.html %}
</head>
<body class="{% if page.layout == 'project-page' %}is-project{% endif %}">
  <a class="skip-link" href="#site-main">Skip to content</a>
  {% include site-nav.html %}
  <main id="site-main" class="site-main">
    {{ content }}
  </main>
  {% include site-footer.html %}

  <button type="button" class="to-top" id="to-top" aria-label="Back to top" title="Back to top">
    <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
  </button>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged figure" hidden>
    <button type="button" class="lightbox__close" aria-label="Close">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
    <figure class="lightbox__figure">
      <img class="lightbox__img" alt="">
      <figcaption class="lightbox__caption"></figcaption>
    </figure>
  </div>

  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
