---
layout: default
---
<article class="article">
  {% if page.title %}
  <h1 class="article__title">{{ page.title }}</h1>
  {% endif %}
  {% if page.date %}
  <p class="article__meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
